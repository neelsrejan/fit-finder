name: Learning site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the public site
        run: |
          rm -rf _site
          mkdir -p _site/demo/fixtures _site/extracts _site/powerbi
          cp -a academy/site/. _site/
          cp demo-store/index.html demo-store/panel.js _site/demo/
          cp demo-store/fixtures/top.html _site/demo/fixtures/
          cp deploy/public.json _site/demo/config.json
          cp analytics/extracts/*.csv analytics/extracts/summary.json _site/extracts/
          cp analytics/powerbi/public.html _site/powerbi/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
