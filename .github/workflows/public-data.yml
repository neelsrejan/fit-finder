name: Public data check

on:
  workflow_dispatch:

jobs:
  ucsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Download the public UCSD files and check the cleaned counts
        run: |
          python - << 'PY'
          import json
          from pathlib import Path
          from fit_finder.data.pipeline import build_public_frame, _profile
          frame = build_public_frame(Path("data/raw"))
          profile = _profile(frame)
          committed = json.loads(Path("docs/metrics/data_profile.json").read_text())
          assert profile["rows"] == committed["rows"] == 275334
          assert profile["by_source"] == committed["by_source"]
          assert profile["fit"] == {key: int(value) for key, value in committed["fit"].items()}
          assert "review_text" not in frame.columns
          print(json.dumps({"rows": profile["rows"], "users": profile["users"], "items": profile["items"]}))
          PY
