<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>fit-finder</title>
  <style>
    body { font: 15px/1.4 "Segoe UI", sans-serif; margin: 24px; color: #14232b; }
    p { max-width: 36em; }
  </style>
</head>
<body>
  <h1>fit-finder</h1>
  <p>This extension reads the bundled demo store at <code>http://127.0.0.1</code> or <code>localhost</code>. It does not run on retailer sites.</p>
  <p>Serve the demo with <code>python -m http.server 8080</code> from the <code>demo-store</code> folder, load this folder as an unpacked extension, and open the page.</p>
</body>
</html>
